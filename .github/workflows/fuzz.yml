name: Fuzz

# The fuzz tests (test/fuzz/) run in every `mix test`, 100 inputs per
# property. This runs them far longer, when started by hand. A failure
# prints the shrunk input: add it to the module's regular tests.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Inputs per property
        default: "200000"

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  fuzz:
    name: Fuzz (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        suite: [smtp, message, dns, queue]
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - name: Restore deps and build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - run: mix deps.get

      - name: Fuzz
        env:
          FUZZ_RUNS: ${{ inputs.runs || '200000' }}
        run: mix fuzz test/fuzz/${{ matrix.suite }}_fuzz_test.exs --seed "$GITHUB_RUN_ID"
