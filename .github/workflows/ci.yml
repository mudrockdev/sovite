name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  test:
    name: Lint, test, and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - name: Restore deps and build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - name: Restore Dialyzer PLTs
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: plts-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: plts-${{ runner.os }}-

      - run: mix deps.get
      - run: mix deps.unlock --check-unused

      - name: Format, compile, credo, xref cycles
        run: mix lint

      - name: Component boundaries
        run: ./scripts/check_boundaries.sh

      - name: Tests with coverage
        run: mix test --cover --warnings-as-errors

      - name: Dialyzer
        run: mix dialyzer --format github

  release:
    name: Build release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    env:
      MIX_ENV: prod
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - run: mix deps.get --only prod
      - run: mix release

      - name: Smoke test sovitectl
        run: _build/prod/rel/sovite/bin/sovitectl config check _build/prod/rel/sovite/etc/sovite.toml.example
