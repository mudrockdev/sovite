name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  test:
    name: Lint, test, and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - name: Restore deps and build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - name: Restore Dialyzer PLTs
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: plts-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: plts-${{ runner.os }}-

      - run: mix deps.get
      - run: mix deps.unlock --check-unused

      - name: Format, compile, credo, xref cycles
        run: mix lint

      - name: Component boundaries
        run: ./scripts/check_boundaries.sh

      - name: Tests with coverage
        run: mix test --cover --warnings-as-errors

      - name: Dialyzer
        run: mix dialyzer --format github

  release:
    name: Build release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    env:
      MIX_ENV: prod
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - run: mix deps.get --only prod
      - run: mix release

      - name: Smoke test sovitectl
        run: _build/prod/rel/sovite/bin/sovitectl config check _build/prod/rel/sovite/etc/sovite.toml.example

  # The single binaries and their .deb and .rpm packages (mix
  # build.release.x86 and build.release.aarch64), for each architecture.
  binaries:
    name: Build ${{ matrix.target }} binary and packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64
            task: build.release.x86
          - target: aarch64
            task: build.release.aarch64
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches the version in mix.exs
        run: |
          version=$(grep -m1 'version:' mix.exs | sed 's/.*"\(.*\)".*/\1/')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but mix.exs says $version"
            exit 1
          fi

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - uses: docker/setup-buildx-action@v3

      - run: mix deps.get

      # Builds in packaging/Containerfile.release; both targets build on x86_64.
      - run: mix ${{ matrix.task }} --engine docker

      - name: Checksums
        run: cd release && sha256sum -c *.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: sovite-${{ matrix.target }}
          path: release/
          if-no-files-found: error

  # Runs what was built on its own architecture: the binary, and the
  # .deb installed as on a server.
  smoke:
    name: Smoke test ${{ matrix.target }}
    needs: binaries
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64
            runner: ubuntu-latest
          - target: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sovite-${{ matrix.target }}
          path: release

      - name: The binary runs
        run: |
          chmod +x release/sovite-*-linux-${{ matrix.target }}
          release/sovite-*-linux-${{ matrix.target }} version

      - name: The .deb installs, and its commands run
        run: |
          sudo apt-get install -y ./release/sovite_*.deb
          sovitectl version
          sudo sovitectl config check
          sudo -u nobody /usr/lib/sovite/bin/newaliases

      - name: The service starts, answers, and stops under systemd
        run: |
          sudo systemctl start sovite
          for i in $(seq 1 30); do sudo test -f /var/lib/sovite/admin.token && break; sleep 1; done
          sudo sovitectl status
          sudo systemctl stop sovite

      - name: Service logs
        if: failure()
        run: sudo journalctl -u sovite --no-pager -n 200

      - name: The .deb uninstalls
        run: |
          sudo apt-get remove -y sovite
          test ! -e /usr/lib/sovite/.burrito

  # A GitHub release of the tag, with the binaries, packages, and sums.
  publish:
    name: Publish the GitHub release
    needs: [release, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sovite-*
          path: release
          merge-multiple: true

      - name: Checksums
        run: |
          cd release
          sha256sum -c *.sha256
          cat *.sha256 > SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags such as v1.0.0-rc.1 are pre-releases.
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; *) prerelease= ;; esac
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Sovite ${GITHUB_REF_NAME#v}" \
            --generate-notes $prerelease
